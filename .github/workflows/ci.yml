name: CI

on:
  push:
  pull_request:

jobs:
  pure-tests:
    name: Pure-Python tests (no Maya)
    runs-on: ubuntu-latest
    # Aligns with the Python shipped by Maya 2027 (3.13.3).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run pure-Python suite
        run: python -m pytest -v
